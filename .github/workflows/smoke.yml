name: cross-platform-smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m unittest discover -s engine/tests -q
        env:
          PYTHONPATH: engine
      - run: python -m compileall -q engine
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo check
        working-directory: src-tauri
